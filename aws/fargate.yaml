AWSTemplateFormatVersion: 2010-09-09

Description: >
  asobann on ECS Fargate.
  ADR 0004 に基づき、ECS on EC2 から Fargate へ移行するための構成。
  MongoDB は Atlas を使うため、このスタックはデータストアを持たない（ADR 0003）。
  Route53レコードとACM証明書は別アカウントのホストゾーンに関わるため、このスタックの外で扱う。

  デプロイ例（タグはスタック単位で付けると対応リソースへ自動で伝播する）:
    aws cloudformation deploy --template-file aws/fargate.yaml --stack-name asobann-fargate \
      --capabilities CAPABILITY_IAM --tags Project=asobann Env=prod \
      --parameter-overrides PublicHostname=... CertificateArn=... AppImage=...

Parameters:
  PublicHostname:
    Type: String
    Description: このスタックが応答するホスト名。切り替え前は next.asobann.yattom.jp 等、切り替え時に asobann.yattom.jp へ変更する

  CertificateArn:
    Type: String
    Description: ALBに設定するACM証明書。このアカウント・このリージョンに存在すること

  AppImage:
    Type: String
    Description: アプリのコンテナイメージURI

  MongoDbUriParameterName:
    Type: String
    Default: /asobann/prod/mongodb_uri
    # 先頭の / を前提にARNを組み立てるため、形式を強制する
    AllowedPattern: ^/.+
    ConstraintDescription: /で始まるSSMパラメータ名を指定すること
    Description: MongoDB接続文字列を格納したSSMパラメータ名（SecureString）

  AppTaskCount:
    Type: Number
    Default: 1
    Description: タスク数。1ならRedis不要でスティッキーセッションも実質不要（ADR 0004）

  TaskCpu:
    Type: String
    Default: 256

  TaskMemory:
    Type: String
    Default: 512

  GoogleAnalyticsId:
    Type: String
    Default: ''

  RedisTaskCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: >
      0ならRedis関連リソース一式を作らない（ADR 0004の既定）。1でRedisタスクを1つ立て、
      appタスクにREDIS_URIを渡してsocket.ioのclient_managerをAsyncRedisManagerにする。
      AppTaskCountを2以上にするときは1にすること（水平スケーリングの実測用、R5）

  RedisTaskCpu:
    Type: String
    Default: 256

  RedisTaskMemory:
    Type: String
    Default: 512


Conditions:
  UseRedis: !Equals [!Ref RedisTaskCount, 1]


Resources:

  # ---------------------------------------------------------------- ネットワーク
  # NAT Gatewayを置かず、タスクをパブリックサブネットに直接配置する。
  # ECRとAtlasへの通信はInternet Gateway経由。NAT Gateway代（月$30〜40）を避けるため。

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.1.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.1.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RouteTable
      SubnetId: !Ref PublicSubnet2

  # ---------------------------------------------------------------- セキュリティグループ

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: asobann load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: http (redirects to https)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: https

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: asobann app tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: from load balancer only

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseRedis
    Properties:
      GroupDescription: asobann redis (R5 水平スケーリング実測用)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: from app tasks only

  # ---------------------------------------------------------------- ロードバランサ

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      LoadBalancerAttributes:
        # socket.ioのping間隔は25秒。既定の60秒でも足りるが、依存を明示するため設定する
        - Key: idle_timeout.timeout_seconds
          Value: 120

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: LoadBalancer
    Properties:
      VpcId: !Ref Vpc
      Port: 5000
      Protocol: HTTP
      # Fargateはawsvpcネットワークモードのため instance ではなく ip
      TargetType: ip
      # 注意: / はテーブル名を乱数生成してリダイレクトするだけでDBに触れない。
      # ゴミテーブルは作られない代わりに、MongoDBが落ちてもこのチェックは通り続ける。
      # DBの死活はこのヘルスチェックでは検知できないため、別途監視が必要。
      # （アプリ側に疎通用エンドポイントが無く、イメージを変更しない方針のため）
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      # トップページは新規テーブルへ302リダイレクトするため 200 だけでは不合格になる
      Matcher:
        HttpCode: 200-399
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: 30
        # 1タスクなら実質不要だが、タスクを増やしたときにsocket.ioのハンドシェイクが
        # 破綻しないよう有効にしておく（pollingで握手してからwebsocketへ上がるため）
        - Key: stickiness.enabled
          Value: true
        - Key: stickiness.type
          Value: lb_cookie

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: 443
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------- 画像アップロード先
  # 2023年4月以降に作られるバケットは既定でACLが無効。アプリは public-read ACL を
  # 付けてアップロードするため、明示的にACLを有効化する必要がある。
  # （アプリ側を直すのが本筋だが、ADR 0002によりイメージは変更しない）

  ImageBucket:
    Type: AWS::S3::Bucket
    # このスタックで唯一の永続データ（ユーザがアップロードした画像）が入る。
    # スタック削除や置換で消えないよう明示的に残す。
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: true
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']

  # ---------------------------------------------------------------- IAM
  # 実行ロール: ECSがイメージを引き、ログを書き、シークレットを読むために使う
  # タスクロール: アプリ自身がS3を触るために使う

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        # SecureStringの復号にkms:Decryptは要らない。AWS管理キー(alias/aws/ssm)の
        # キーポリシーが kms:ViaService でアカウント内のSSM経由の復号を許可するため。
        # 実際にこの権限だけでタスクが起動しシークレットを取得できることを確認済み。
        # カスタマー管理キーに切り替える場合は kms:Decrypt の追加が必要になる。
        - PolicyName: read-secrets
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MongoDbUriParameterName}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: image-bucket-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:GetObject
                Resource: !Sub ${ImageBucket.Arn}/*
        # 旧構成ではEC2ホストへ入る手段が全滅し（SSH鍵紛失、EC2 Instance ConnectとSSMは
        # エージェント未導入）、DBのダンプ取得にセキュリティグループの一時開放が必要になった。
        # 同じ轍を踏まないよう、最初からECS Execでコンテナに入れるようにしておく。
        #   aws ecs execute-command --cluster <name> --task <id> --container app --interactive --command /bin/bash
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 30

  # ---------------------------------------------------------------- ECS

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-app
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref AppImage
          Essential: true
          # イメージのCMDは `python3 -m asobann.deploy ; python3 -m asobann.asgi` で、
          # 起動のたびにキット初期化がDBを上書きし、イメージに無いキットを消してしまう。
          # 初期化を実行しないよう上書きする（ADR 0007）
          Command:
            - python3
            - -m
            - asobann.asgi
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Environment:
            - Name: PUBLIC_HOSTNAME
              Value: !Ref PublicHostname
            - Name: FLASK_ENV
              Value: production
            - Name: GOOGLE_ANALYTICS_ID
              Value: !Ref GoogleAnalyticsId
            - Name: UPLOADED_IMAGE_STORE
              Value: s3
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_S3_IMAGE_BUCKET_NAME
              Value: !Ref ImageBucket
            # config_common.py は UPLOADED_IMAGE_STORE=s3 のとき AWS_KEY / AWS_SECRET を必須にする。
            # 空文字を渡すと boto3 は明示指定とみなさず既定の認証チェーンにフォールバックし、
            # タスクロールが使われる（イメージ内で実測確認済み）。静的キーを持たずに済む
            - Name: AWS_KEY
              Value: ''
            - Name: AWS_SECRET
              Value: ''
            # R5(水平スケーリング実測)用。UseRedisが偽なら空文字を渡し、アプリ側の
            # `if app.config['REDIS_URI']:` で無効化される（AsyncRedisManagerを使わず単一
            # タスク相当の動作のまま）。redis+srv:// はアプリ側のresolve_redis_srvが
            # Cloud MapのSRVレコード(_redis._tcp.<namespace>)を解決する前提の形式
            - Name: REDIS_URI
              Value: !If [UseRedis, !Sub 'redis+srv://${AWS::StackName}.local', '']
          Secrets:
            - Name: MONGODB_URI
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MongoDbUriParameterName}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group: !Ref LogGroup
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref AppTaskCount
      TaskDefinition: !Ref TaskDefinition
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          # NAT Gatewayを置かないため、パブリックIPを付けてIGW経由で外に出る
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 5000
          TargetGroupArn: !Ref TargetGroup

  # ---------------------------------------------------------------- Redis (R5 水平スケーリング実測用)
  # ADR 0004は「1タスクならRedis不要」としてRedisを撤去した。AppTaskCountを2以上にする
  # 場合のみ、socket.ioのイベントをタスク間でpub/subするために必要になる。
  # ElastiCacheではなくECSタスクとして自前運用する理由（2026-08-19決定、
  # asobann_docsのworklog参照）: 常設しないstagingではElastiCache Serverlessの
  # 最低課金が効いてしまうこと、サイズ変更が速いこと、redis-cli infoで直接
  # スループット・データ量が採れること。

  RedisNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Condition: UseRedis
    Properties:
      Name: !Sub ${AWS::StackName}.local
      Vpc: !Ref Vpc

  RedisDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Condition: UseRedis
    Properties:
      Name: redis
      NamespaceId: !Ref RedisNamespace
      DnsConfig:
        DnsRecords:
          - Type: SRV
            TTL: 10
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  RedisTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: UseRedis
    Properties:
      Family: !Sub ${AWS::StackName}-redis
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref RedisTaskCpu
      Memory: !Ref RedisTaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: redis
          Image: redis:7-alpine
          Essential: true
          PortMappings:
            - ContainerPort: 6379
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group: !Ref LogGroup
              awslogs-stream-prefix: redis

  RedisService:
    Type: AWS::ECS::Service
    Condition: UseRedis
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: 1
      TaskDefinition: !Ref RedisTaskDefinition
      EnableExecuteCommand: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          # NAT Gatewayが無いため、Docker Hubからredis:7-alpineを引くにはIGW経由が要る
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref RedisSecurityGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt RedisDiscoveryService.Arn


Outputs:
  LoadBalancerDnsName:
    Description: Route53のALIASレコードの向き先に指定する値
    Value: !GetAtt LoadBalancer.DNSName

  LoadBalancerHostedZoneId:
    Description: ALIASレコード作成時に必要なホストゾーンID
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID

  ImageBucketName:
    Description: 旧アカウントのバケットから中身を同期する先
    Value: !Ref ImageBucket

  ClusterName:
    Value: !Ref Cluster
